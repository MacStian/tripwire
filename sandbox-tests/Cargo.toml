[package]
name = "sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "End-to-end tests of the guard against a real Sputnik DAO v2 in a local sandbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
cargo-near-build = "0.11"
near-api = { version = "0.8", default-features = false }
near-sandbox = "0.4"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
