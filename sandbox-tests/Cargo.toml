[package]
name = "sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "End-to-end tests of the guard against a real Sputnik DAO v2 in a local sandbox"

[dependencies]
anyhow = "1"
base64 = "0.22"
cargo-near-build = "0.11"
guard = { path = "../contracts/guard" }
near-api = { version = "0.8", default-features = false }
near-sandbox = "0.4"
near-sdk = { workspace = true, features = ["non-contract-usage"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = "1"
serde_json = "1"
tripwire-agent = { path = "../agent" }
tokio = { version = "1", features = ["full"] }
