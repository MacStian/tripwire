[package]
name = "tripwire-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Invoice agent for the Tripwire guard: reads an invoice and asks the guard to pay it"

[lib]
name = "tripwire_agent"

[[bin]]
name = "tripwire-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
near-api = { version = "0.8", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
